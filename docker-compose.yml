services:
  postgres:
    image: postgres:16
    container_name: assuro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: assuro
      POSTGRES_PASSWORD: assuro_dev_pass
      POSTGRES_DB: assuro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assuro -d assuro"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assuro-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASSURO_DATABASE_URL: postgresql://assuro:assuro_dev_pass@postgres:5432/assuro?sslmode=disable
      ASSURO_JWT_SECRET: dev-secret-change-me-in-production
      ASSURO_ENVIRONMENT: dev
      ASSURO_LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
